name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download Android SDK cmdline-tools
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -s --retry 3 --retry-delay 2 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Accept licenses & install SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Build Debug APK
        shell: bash
        run: |
          gradle clean --no-daemon 2>/dev/null || true
          gradle assembleDebug --no-daemon --stacktrace --info > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "===== BUILD FAILED - Extracting errors ====="
            echo ""
            echo "--- Kotlin/Java compile errors ---"
            grep -E "^(e:|w:|error:|warning:|Caused by:.*Compilation)" build.log 2>/dev/null | head -30 || echo "(no error lines found)"
            echo ""
            echo "--- Last 10 completed tasks ---"
            grep -E "^> Task" build.log | tail -10
            echo ""
            echo "--- Last 40 lines of build.log ---"
            tail -n 40 build.log
            exit $EXIT_CODE
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
