name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Show environment
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_VERSION: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Gradle files:"
          ls -la app/build.gradle settings.gradle build.gradle gradle.properties
          echo "SDK content:"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME empty"

      - name: Generate gradle wrapper
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          gradle --version || echo "gradle not available"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          # Create local.properties if needed
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Run gradle
          echo "Running gradle assembleDebug..."
          gradle assembleDebug --no-daemon --refresh-dependencies --stacktrace
          
          echo "Build complete, checking output..."
          ls -la app/build/outputs/apk/debug/ || echo "No output folder"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore