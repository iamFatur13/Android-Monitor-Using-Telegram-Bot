name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download Android SDK cmdline-tools
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -s --retry 3 --retry-delay 2 -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

      - name: Accept licenses & install SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Show Kotlin errors on failure
        if: failure()
        shell: bash
        run: |
          echo "===== Kotlin compile errors ====="
          grep -E "^(e:|error:|w:|warning:)" build.log || echo "(no e:/w:/error: lines found)"
          echo ""
          echo "===== Last 80 lines of build log ====="
          tail -n 80 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
